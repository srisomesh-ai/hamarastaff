name: Build Android App
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.9' }
      - name: Build debug APK (for testing)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Surface build errors
        if: failure()
        run: |
          echo "::error::===== BUILD FAILED — key lines ====="
          grep -n "error:\|FAILURE:\|Caused by\|What went wrong" build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
          tail -30 build.log | while IFS= read -r l; do echo "::error::TAIL: $l"; done
      - name: Build release AAB (for Play Store)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: HamaraStaff-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HamaraStaff-release-aab
          path: android/app/build/outputs/bundle/release/app-release*.aab
